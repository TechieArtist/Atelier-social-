<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile • The Atelier</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="app-nav">
    <a class="logo" href="feed.html" style="font-size:1.6rem;">The Atelier</a>
    <ul>
      <li>
        <a href="feed.html" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-8 9 8" /><path d="M5 10v10h5v-6h4v6h5V10" />
          </svg>
        </a>
      </li>
      <li>
        <a href="search.html" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
          </svg>
        </a>
      </li>
     <li>
  <a href="feed.html" aria-label="Create post">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4" /><path d="M12 8v8M8 12h8" />
    </svg>
  </a>
</li>
    <li>
        <a href="profile.html" aria-current="page" aria-label="Profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" /><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6" />
          </svg>
        </a>
      </li>
      <li>
        <a href="#" data-logout aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" />
          </svg>
        </a>
      </li>
    </ul>
  </header>

  <main class="app-main">
    <div class="profile-header">
      <label class="avatar" id="avatar" for="avatar-input">
        <img id="avatar-img" style="display:none;" alt="" />
        <svg id="avatar-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4" /><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6" />
        </svg>
      </label>
      <input type="file" id="avatar-input" accept="image/*" class="visually-hidden" />
      <div class="profile-info">
        <p class="username" id="username">username</p>
        <ul class="stats">
          <li><strong id="post-count">0</strong><span>posts</span></li>
          <li><strong id="follower-count">0</strong><span>followers</span></li>
          <li><strong id="following-count">0</strong><span>following</span></li>
        </ul>
      </div>
    </div>
    <p class="status-line" id="avatar-status"></p>

    <section class="admin-section">
      <h2>Edit profile</h2>
      <form id="edit-form" novalidate>
        <div class="field">
          <label for="edit-username">Username</label>
          <input type="text" id="edit-username" name="username" required />
        </div>
        <div class="field">
          <label for="edit-bio">Bio</label>
          <textarea id="edit-bio" name="bio" maxlength="500" rows="3" placeholder="Tell people about yourself…"></textarea>
        </div>
        <p class="field-note" id="edit-error" role="alert"></p>
        <button type="submit" class="btn" style="width:auto; padding:8px 24px;">Save profile</button>
        <p class="status-line" id="edit-status"></p>
      </form>
    </section>

    <div class="post-grid" id="post-grid">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
  </main>

  <script src="js/session.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
