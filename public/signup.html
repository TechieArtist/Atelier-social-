
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up • The Atelier</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/signup.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-wrap">
      <div class="auth-card">
        <p class="logo">The Atelier</p>
        <p class="subhead">Sign up to see art from creators you follow.</p>

        <form id="signup-form" novalidate>
          <div class="field">
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required />
          </div>
          <div class="field">
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required />
          </div>
          <div class="field">
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required />
          </div>
          <div class="field">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" autocomplete="new-password" required />
          </div>
          <p class="field-note" id="form-error" role="alert"></p>

          <p class="terms">
            By signing up, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
          </p>

          <button type="submit" class="btn">Create Account</button>
          <p class="status-line" id="status-line"></p>
        </form>
      </div>

      <div class="auth-foot">
        <span>Already have an account? </span><a href="login.html">Log In</a>
      </div>
    </div>
  </main>

  <script src="js/signup.js"></script>
</body>
</html>
