
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In • The Atelier</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-wrap">
      <div class="auth-card">
        <p class="logo">The Atelier</p>

        <form id="login-form" novalidate>
          <div class="field">
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required />
          </div>
          <div class="field">
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
          </div>
          <p class="field-note" id="form-error" role="alert"></p>

          <button type="submit" class="btn">Log In</button>
          <p class="status-line" id="status-line"></p>

          <a class="forgot" href="#">Forgot password?</a>
        </form>
      </div>

      <div class="auth-foot">
        <span>Don't have an account? </span><a href="signup.html">Create an Account</a>
      </div>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
